
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <!-- Load users.js with defer as requested -->
  <script src="users.js" defer></script>
</head>
<body>
  <h1>User Directory</h1>
  
  <!-- Button to load users -->
  <button id="load-users">Load Users</button>
  
  <!-- Labelled filter input -->
  <label for="filter-input">Filter by name:</label>
  <input id="filter-input" type="text" placeholder="Type to filter...">
  
  <!-- Status message paragraph -->
  <p id="status"></p>
  
  <!-- Empty list for users -->
  <ul id="users-list"></ul>
</body>
</html>
